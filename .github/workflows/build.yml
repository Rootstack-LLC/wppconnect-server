name: build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  build:
    # Runs after changes are merged (push to develop/main), not during PR
    # review, per Susan's request. test/runtime-matrix/docker still run on
    # pull_request per their own triggers/conditions — unchanged here.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    # Safe on self-hosted: the `if:` above already excludes pull_request
    # entirely, so only push to develop/main (requires write access, not
    # reachable from an external fork) ever reaches this job.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Setup yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build source
        run: yarn build

      - name: Test server and Manager contracts
        run: yarn test --runInBand

  lint:
    # Temporarily disabled in CI at Susan's request. The `yarn lint` script
    # and ESLint config/rules are untouched — only this job's execution is
    # gated off. actionlint flags a bare `if: false` as a constant
    # condition, so this uses an undefined-by-default repository variable
    # instead: re-enable by setting LINT_ENABLED=true as a repo variable,
    # or just delete this `if:` line.
    if: vars.LINT_ENABLED == 'true'
    # Intentionally kept on ubuntu-latest, not self-hosted: this job is
    # still wired to the workflow-level `pull_request: '*'` trigger, so if
    # LINT_ENABLED is ever flipped on, it would run for external fork PRs
    # too. Do not move to self-hosted unless this job also gets its own
    # push-only `if:` like `build` above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Setup yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint source
        run: yarn lint

  test:
    # Kept on ubuntu-latest: no job-level `if:` restricts this job, so it
    # still runs on both push and pull_request (any branch, including
    # external fork PRs on this public repo). Do not move to self-hosted
    # without first adding a push-only guard like `build`'s above.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Setup yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn jest

      - name: Validate provider cryptography
        run: yarn smoke:provider-crypto

      - name: Validate Chromium protocols and schema bounds
        run: yarn smoke:browser-protocol

  runtime-matrix:
    if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
    # Must stay on ubuntu-latest: by design this job only ever runs on
    # pull_request (its `if:` above has no push path at all), so on this
    # public repo 100% of its executions are PR-triggered — including
    # from external forks. Never move this one to self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Setup Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate provider imports and QR generation
        env:
          MATRIX_TEST_GO: '0'
          MATRIX_QR_TIMEOUT_MS: '120000'
          MATRIX_NODE_LOG_LEVEL: warn
        run: yarn test:runtime-matrix
