name: build

on:
  push:
    # '*' does not match a branch name containing '/' (GitHub's glob rules:
    # a single '*' never crosses '/'). '**' is required so internal
    # branches like fix/foo or ci/bar actually trigger this push build.
    branches:
      - '**'
  pull_request:
    # This filters on the PR's base branch, not its head/source branch, so
    # '*' here is unaffected by source branch names containing '/' — kept
    # as '**' anyway for consistency and to avoid the same footgun if a
    # slash-containing base branch is ever used.
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    # Never runs for pull_request: this repo is public, and a self-hosted
    # runner must not execute code from an untrusted external PR. Only
    # push to an internal branch (requires write access) reaches here.
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Setup yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build source
        run: yarn build

      - name: Test server and Manager contracts
        run: yarn test --runInBand

  lint:
    # Same reasoning as build above: push-only, never pull_request.
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: corepack prepare yarn@4.14.1 --activate

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Setup yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint source
        run: yarn lint
