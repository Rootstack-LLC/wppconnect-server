name: Publish DemoE image to GHCR

# Publishes the fix/profile-lock-efs-ecs-coordination branch to GHCR for
# Susan's ECS DemoE environment, independent of the Docker Hub release in
# docker.yml (which only tracks main/develop/tags and the official
# wppconnect/wppconnect-server image name).

on:
  push:
    branches:
      - fix/profile-lock-efs-ecs-coordination
  workflow_dispatch:

concurrency:
  group: ghcr-publish-demoe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rootstack-llc/wppconnect-server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=sha
          labels: |
            org.opencontainers.image.title=wppconnect-server (DemoE fork build)
            org.opencontainers.image.description=Rootstack fork build from fix/profile-lock-efs-ecs-coordination for ECS DemoE — not the upstream wppconnect/wppconnect-server image.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}

      - name: Build image for verification (local load, not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify flock(util-linux) is present
        run: |
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm --entrypoint sh "$image" -c "flock --version" | grep -i "util-linux"

      - name: Verify PR #1 profile-lock code is in the built image
        run: |
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm --entrypoint sh "$image" -c "grep -rl PROFILE_LOCK_ORPHAN_KILL_AFTER_S /usr/src/wpp-server/dist" | grep -q .

      - name: Verify built image architecture is linux/amd64 (ECS Fargate/EC2 compatible)
        run: |
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          arch="$(docker image inspect --format '{{ .Architecture }}' "$image")"
          os="$(docker image inspect --format '{{ .Os }}' "$image")"
          test "$os" = "linux"
          test "$arch" = "amd64"

      - name: Verify the image is labeled with the commit that built it
        run: |
          image="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
          test "$revision" = "${{ github.sha }}"

      - name: Push the exact verified image (no rebuild)
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Re-pull from the registry and report the verified digest
        id: verify_push
        run: |
          primary="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker rmi "$primary"
          docker pull "$primary"
          digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$primary")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$primary")"
          test "$revision" = "${{ github.sha }}"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
          echo "repo_digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Report published digest
        run: |
          echo "Image: ${{ env.IMAGE_NAME }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.verify_push.outputs.digest }}"
          echo "Pull reference: ${{ steps.verify_push.outputs.repo_digest }}"
