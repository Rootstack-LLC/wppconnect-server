name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      increment:
        description: 'Tipo de incremento: patch, minor, major ou pre*'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    # Safe on self-hosted: only push-to-main (requires write access) and
    # manual workflow_dispatch (requires collaborator write access) trigger
    # this job — never pull_request.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Determine release
        id: release-check
        shell: bash
        env:
          REQUESTED_INCREMENT: ${{ inputs.increment }}
        run: |
          increment="${REQUESTED_INCREMENT:-patch}"
          should_release=true

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            increment=patch
            latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"

            if [[ -n "$latest_tag" ]] && git diff --quiet "$latest_tag..HEAD" -- .; then
              should_release=false
              echo "No changes since $latest_tag; skipping duplicate release"
            fi
          fi

          echo "increment=$increment" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Setup GIT
        if: steps.release-check.outputs.should_release == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        if: steps.release-check.outputs.should_release == 'true'
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.2

      - name: Enable Corepack
        if: steps.release-check.outputs.should_release == 'true'
        run: corepack enable

      - name: Setup yarn cache
        if: steps.release-check.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        if: steps.release-check.outputs.should_release == 'true'
        run: yarn install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Generate Swagger docs
        if: steps.release-check.outputs.should_release == 'true'
        run: yarn docs

      # Disabled until explicit approval: this auto-commits to main
      # unattended. Re-enable by setting RELEASE_PUBLISH_ENABLED=true as a
      # repository variable once Susan/the team deliberately wants this
      # automation live again.
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: >-
          steps.release-check.outputs.should_release == 'true' &&
          vars.RELEASE_PUBLISH_ENABLED == 'true'
        with:
          commit_message: 'docs: Improovment on docs'
          file_pattern: 'src/swagger.json'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # Disabled until explicit approval: cuts a real version bump/tag/
      # release unattended. Same RELEASE_PUBLISH_ENABLED gate as above.
      - name: Release
        if: >-
          steps.release-check.outputs.should_release == 'true' &&
          vars.RELEASE_PUBLISH_ENABLED == 'true'
        run: 'npx release-it --increment ${{ steps.release-check.outputs.increment }}'
