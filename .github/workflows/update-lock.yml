name: update-lock

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  update-lock:
    # Safe on self-hosted: only triggers on push to main (requires write
    # access), never reachable from an external pull_request.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup yarn cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: yarn install

      # Disabled until explicit approval: auto-commits to main unattended.
      # Re-enable by setting LOCKFILE_AUTOCOMMIT_ENABLED=true as a
      # repository variable once this automation is deliberately wanted.
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: vars.LOCKFILE_AUTOCOMMIT_ENABLED == 'true'
        with:
          commit_message: 'chore: Updated yarn.lock'
          file_pattern: yarn.lock
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
